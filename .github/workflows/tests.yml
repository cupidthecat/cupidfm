name: Build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev libmagic-dev libssl-dev zlib1g-dev libbz2-dev liblzma-dev python3
      - name: Build application
        run: make
      - name: Run terminal startup and shutdown
        run: python3 tests/test_terminal_smoke.py
      - name: Run bundled library tests
        run: make -j2 test-libs
      - name: Run tests
        run: make test
      - name: Run file-command regressions with sanitizers
        run: |
          rm tests/file_command_driver
          make -C tests test-file-commands CFLAGS='-Wall -Wextra -g -std=c2x -fsanitize=address,undefined -fno-omit-frame-pointer' LIBS='-fsanitize=address,undefined'
      - name: Run history allocation failures with sanitizers
        run: |
          rm tests/test_history_allocations
          make -C tests test_history_allocations CFLAGS='-Wall -Wextra -g -std=c2x -fsanitize=address,undefined -fno-omit-frame-pointer' LIBS='-fsanitize=address,undefined'
          ./tests/test_history_allocations
      - name: Run editor range validation with sanitizers
        run: |
          rm tests/test_editor_ranges
          make -C tests test_editor_ranges CFLAGS='-Wall -Wextra -g -std=c2x -fsanitize=address,undefined -fno-omit-frame-pointer' LIBS='-fsanitize=address,undefined'
          ./tests/test_editor_ranges
      - name: Run editor allocation failures with sanitizers
        run: |
          rm tests/test_editor_allocations
          make -C tests test_editor_allocations CFLAGS='-Wall -Wextra -g -std=c2x -fsanitize=address,undefined -fno-omit-frame-pointer' LIBS='-fsanitize=address,undefined'
          ./tests/test_editor_allocations
      - name: Run editor loading with sanitizers
        run: |
          rm tests/test_editor_loading
          make -C tests test_editor_loading CFLAGS='-Wall -Wextra -g -std=c2x -fsanitize=address,undefined -fno-omit-frame-pointer' LIBS='-fsanitize=address,undefined'
          ./tests/test_editor_loading
      - name: Run editor save errors with sanitizers
        run: |
          rm tests/test_editor_save
          make -C tests test_editor_save CFLAGS='-Wall -Wextra -g -std=c2x -fsanitize=address,undefined -fno-omit-frame-pointer' LIBS='-fsanitize=address,undefined'
          ./tests/test_editor_save
      - name: Run editor format and atomic save checks with sanitizers
        run: |
          rm tests/test_editor_roundtrip tests/test_editor_atomic_save
          make -C tests test_editor_roundtrip test_editor_atomic_save CFLAGS='-Wall -Wextra -g -std=c2x -fsanitize=address,undefined -fno-omit-frame-pointer' LIBS='-fsanitize=address,undefined'
          ./tests/test_editor_roundtrip
          ./tests/test_editor_atomic_save
      - name: Check configuration keys and plugin execution with sanitizers
        run: |
          rm tests/test_config_keys tests/test_plugins_api
          make -C tests test_config_keys test_plugins_api CFLAGS='-Wall -Wextra -g -std=c2x -fsanitize=address,undefined -fno-omit-frame-pointer' LIBS='-fsanitize=address,undefined'
          ./tests/test_config_keys
          ./tests/test_plugins_api
      - name: Check archive previews with sanitizers
        run: |
          rm tests/test_archive_preview
          make -C tests test_archive_preview CFLAGS='-Wall -Wextra -g -std=c2x -fsanitize=address,undefined -fno-omit-frame-pointer' LIBS='-fsanitize=address,undefined'
          python3 tests/test_archive_preview.py
      - name: Check bounded text previews with sanitizers
        run: |
          make -B -C tests test_text_preview CFLAGS='-Wall -Wextra -g -O1 -std=c2x -fsanitize=address,undefined -fno-omit-frame-pointer' LIBS='-fsanitize=address,undefined'
          ./tests/test_text_preview
      - name: Build all sources with sanitizers and check startup
        run: |
          make -j2 CFLAGS='-Wall -Wextra -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer'
          python3 tests/test_terminal_smoke.py
